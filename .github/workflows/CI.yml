name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - Symbolics ${{ matrix.symbolics }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        symbolics:
          - '6'
          - '7'
        os:
          - ubuntu-latest
        arch:
          - x64
    env:
      # MathLink supports this mode for loading converters without a kernel.
      JULIA_REGISTRYCI_AUTOMERGE: 'true'
      SYMBOLICSMATHLINK_TEST_MODE: conversions
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Select Symbolics version
        env:
          SYMBOLICS_VERSION: ${{ matrix.symbolics }}
        run: julia --project -e 'using Pkg; Pkg.add(PackageSpec(name="Symbolics", version=ENV["SYMBOLICS_VERSION"])); Pkg.build("MathLink")'
      - name: Test conversions
        run: julia --project -e 'using Pkg; Pkg.test(; allow_reresolve=false)'
